<!doctype html>
<html lang="az">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Gecə Qapısı</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@500;600&display=swap">
<style>
/* Layout: one 9:16 story stage, centered; captions and choices sit over the bottom of the scene */
:root{
  --bg:#0b0d12; --ink:#ece6d8; --dim:#8b90a0; --glow:#f2b84b; --panel:#151925; --danger:#d0503f;
  --display:"Unbounded",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --body:"Inter",system-ui,-apple-system,sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{
  background:var(--bg); color:var(--ink); font-family:var(--body);
  display:flex; flex-direction:column; align-items:center; gap:12px; box-sizing:border-box;
  padding-block:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.frame{width:min(100%,400px,calc((100dvh - 150px) * 0.5625)); min-width:240px; display:grid; gap:10px}
header{display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap}
.titles{display:grid; gap:2px}
h1{font-family:var(--display); font-weight:700; font-size:17px; margin:0; letter-spacing:.02em}
.ep{font:500 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--dim)}
.toggles{display:flex; gap:6px}
.tog{font:500 11px var(--mono); letter-spacing:.06em; color:var(--dim); background:transparent; cursor:pointer;
  border:1px solid #2a3040; border-radius:999px; padding:6px 10px}
.tog[aria-pressed="true"]{color:var(--bg); background:var(--glow); border-color:var(--glow)}
.tog:focus-visible{outline:2px solid var(--glow); outline-offset:2px}
.stage{position:relative; width:100%; aspect-ratio:9/16; border-radius:18px; overflow:hidden; background:#000; cursor:pointer; outline:none}
.stage:focus-visible{box-shadow:0 0 0 2px var(--glow)}
.stage svg{position:absolute; inset:0; width:100%; height:100%; display:block}
.bars{position:absolute; top:10px; left:12px; right:12px; display:flex; gap:4px; z-index:3}
.bar{flex:1; height:3px; border-radius:2px; background:rgba(236,230,216,.22); overflow:hidden}
.bar i{display:block; height:100%; width:0; background:var(--ink); transition:width .2s linear}
.overlay{position:absolute; left:0; right:0; bottom:0; z-index:2; display:grid; gap:12px;
  padding:70px 18px 18px; background:linear-gradient(to bottom,transparent,rgba(5,6,10,.9) 38%)}
.cap{display:grid; gap:6px; min-height:5.2em}
.cap:empty{min-height:0}
.cap p{margin:0; font:400 14.5px/1.5 var(--mono)}
.cap p.old{color:var(--dim)}
.cap p.cur::after{content:"▍"; color:var(--glow); animation:blink 1s steps(1) infinite}
.choices{display:grid; gap:8px}
.choice{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%;
  font:600 14px var(--body); color:var(--ink); text-align:left; cursor:pointer;
  padding:13px 16px; border-radius:10px; border:1px solid rgba(242,184,75,.45); background:rgba(21,25,37,.88);
  animation:rise .45s ease-out both}
.choice:nth-child(3){animation-delay:.12s}
.choice span{font:500 11px var(--mono); color:var(--glow); letter-spacing:.08em}
.choice:hover,.choice:focus-visible{background:var(--glow); color:var(--bg); outline:none}
.choice:hover span,.choice:focus-visible span{color:var(--bg)}
.choice.primary{background:var(--glow); color:var(--bg)}
.choice.primary span{color:var(--bg)}
.ask{font:500 11px var(--mono); letter-spacing:.14em; text-transform:uppercase; color:var(--glow); margin:0}
.end,.start{display:grid; gap:8px; animation:rise .5s ease-out both}
.end h2,.start h2{font-family:var(--display); font-weight:500; font-size:19px; margin:0; text-wrap:balance}
.end .path,.start .sub{font:400 12px/1.5 var(--mono); color:var(--dim); margin:0}
.hint{font:400 12px/1.5 var(--mono); color:var(--dim); text-align:center; margin:0}

@keyframes blink{50%{opacity:0}}
@keyframes rise{from{opacity:0; transform:translateY(8px)}to{opacity:1; transform:none}}
@keyframes flicker{0%,100%{opacity:1}44%{opacity:.7}48%{opacity:.2}52%{opacity:.9}70%{opacity:.6}}
@keyframes push{from{transform:scale(1)}to{transform:scale(1.2)}}
@keyframes walk{0%,100%{transform:scale(1) translateY(0)}50%{transform:scale(1.05) translateY(5px)}}
@keyframes run{0%,100%{transform:scale(1.04) translate(0,0)}25%{transform:scale(1.1) translate(-3px,4px)}75%{transform:scale(1.1) translate(3px,4px)}}
@keyframes doorOpen{from{transform:scaleX(1)}to{transform:scaleX(.1)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes wave{from{transform:scale(.4); opacity:.9}to{transform:scale(6); opacity:0}}
.flicker{animation:flicker 2.8s infinite}
.flicker-slow{animation:flicker 5.5s infinite}
.push{transform-origin:180px 320px; animation:push 11s ease-out forwards}
.walk{transform-origin:180px 320px; animation:walk 1.1s ease-in-out infinite}
.run{transform-origin:180px 320px; animation:run .45s linear infinite}
.door-open{transform-box:fill-box; transform-origin:left center; animation:doorOpen 2.4s .5s cubic-bezier(.6,0,.2,1) forwards}
.door-static{transform-box:fill-box; transform-origin:left center; transform:scaleX(.1)}
.beam{opacity:0; animation:fadeIn 2s 1.2s forwards}
.late{opacity:0; animation:fadeIn 3s 4s forwards}
.wave{transform-box:fill-box; transform-origin:center; animation:wave 2.4s ease-out infinite}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes breathe{0%,100%{transform:scaleY(1)}50%{transform:scaleY(1.07)}}
@keyframes flash{0%,100%{opacity:0}3%{opacity:.4}6%{opacity:0}12%{opacity:.3}15%{opacity:0}33%{opacity:.35}36%{opacity:0}39%{opacity:.25}42%{opacity:0}58%{opacity:.3}61%{opacity:0}}
.breathe{transform-box:fill-box; transform-origin:center bottom; animation:breathe 3.8s ease-in-out infinite}
.flash{opacity:0; animation:flash 2.6s 1s 1}
.tv{animation:flicker 1.3s infinite}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important; animation-iteration-count:1!important; animation-delay:0s!important}
}
</style>

</head>
<body>
<div class="frame">
  <header>
    <div class="titles">
      <h1>Gecə Qapısı</h1>
      <span class="ep">Bölüm 1</span>
    </div>
    <div class="toggles">
      <button class="tog" type="button" id="tog-sound" aria-pressed="true">Effektlər</button>
    </div>
  </header>
  <div class="stage" id="stage" tabindex="0" aria-label="Hekayə səhnəsi. Mətni tez göstərmək üçün toxun.">
    <div class="bars" id="bars"></div>
    <div id="scene"></div>
    <div class="overlay">
      <div class="cap" id="cap" aria-live="polite"></div>
      <div class="choices" id="choices" hidden></div>
      <div class="end" id="end" hidden></div>
      <div class="start" id="start">
        <p class="ask">Bölüm 1 · Qərar səninlə</p>
        <h2>Gecə saat 03:17. Tanımadığın bir evdə gözlərini açırsan.</h2>
        <p class="sub">Qulaqcıqla dinlə.</p>
        <div class="choices">
          <button class="choice primary" type="button" id="go">Başla<span>▶</span></button>
        </div>
      </div>
    </div>
  </div>
  <p class="hint" id="hint">Ekrana toxun: mətn dərhal görünsün</p>
</div>

<script>
const GLOW = "#f2b84b";

/* ---------- Scenes (SVG) ---------- */
function corridor({group = "", red = false, extra = ""} = {}) {
  const wl = red ? "#1e0f11" : "#121620", wr = red ? "#190c0e" : "#0f121a", fl = red ? "#1b0d0f" : "#151925";
  const lines = [0.12, 0.3, 0.55, 0.85].map(t => {
    const y = 390 + t * 250, xl = 150 - 150 * t, xr = 210 + 150 * t;
    return `<line x1="${xl}" y1="${y}" x2="${xr}" y2="${y}" stroke="${red ? '#2c1416' : '#1f2431'}"/>`;
  }).join("");
  return `<svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <radialGradient id="spill" cx="50%" cy="0%" r="80%"><stop offset="0" stop-color="${GLOW}" stop-opacity=".6"/><stop offset="1" stop-color="${GLOW}" stop-opacity="0"/></radialGradient>
    <radialGradient id="lampg"><stop offset="0" stop-color="${red ? '#ff6a55' : '#cfd8ea'}" stop-opacity=".35"/><stop offset="1" stop-color="#cfd8ea" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="360" height="640" fill="#06070a"/>
  <g class="${group}">
    <polygon points="0,0 360,0 210,250 150,250" fill="#0a0c11"/>
    <polygon points="0,0 150,250 150,390 0,640" fill="${wl}"/>
    <polygon points="360,0 210,250 210,390 360,640" fill="${wr}"/>
    <polygon points="0,640 360,640 210,390 150,390" fill="${fl}"/>
    ${lines}
    <polygon points="40,150 90,212 90,450 40,560" fill="#0b0d13" stroke="#1c2130"/>
    <polygon points="320,150 270,212 270,450 320,560" fill="#0b0d13" stroke="#1c2130"/>
    <rect x="150" y="250" width="60" height="140" fill="#0b0d13"/>
    <rect x="160" y="272" width="40" height="110" fill="#1c212d" stroke="#2b3242"/>
    <circle cx="194" cy="330" r="1.6" fill="${GLOW}" opacity=".8"/>
    <rect x="160" y="380" width="40" height="2.5" fill="${GLOW}" class="flicker"/>
    <ellipse cx="180" cy="394" rx="70" ry="16" fill="url(#spill)" class="flicker"/>
    <line x1="180" y1="0" x2="180" y2="88" stroke="#1d2230" stroke-width="2"/>
    <rect x="171" y="88" width="18" height="6" fill="${red ? '#ff6a55' : '#cfd8ea'}" class="flicker-slow"/>
    <circle cx="180" cy="100" r="80" fill="url(#lampg)" class="flicker-slow"/>
    ${extra}
  </g>
</svg>`;
}

function room(mode) {
  const dark = mode === "dark", listen = mode === "listen";
  const waves = dark ? "" : [0, .8, 1.6].map(d =>
    `<circle cx="180" cy="424" r="10" fill="none" stroke="#3b2814" stroke-width="1.5" class="wave" style="animation-delay:${d}s"/>`).join("");
  const shadow = listen ? `<g class="late"><ellipse cx="248" cy="250" rx="16" ry="19" fill="#0a0806"/><path d="M222 540 C222 330 230 275 248 272 C266 275 274 330 274 540Z" fill="#0a0806"/></g>` : "";
  return `<svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">
  <defs>
    <radialGradient id="roomg" cx="50%" cy="68%" r="70%"><stop offset="0" stop-color="${dark ? '#14161d' : '#f6d58e'}"/><stop offset="1" stop-color="${dark ? '#07080b' : '#8a5a22'}"/></radialGradient>
  </defs>
  <rect width="360" height="640" fill="#0f121a"/>
  <g class="${mode === 'enter' ? 'push' : ''}">
    <rect x="0" y="560" width="360" height="80" fill="#141824"/>
    <rect x="80" y="130" width="200" height="410" fill="url(#roomg)"/>
    <line x1="80" y1="470" x2="280" y2="470" stroke="${dark ? '#1a1c24' : '#a7742f'}"/>
    <rect x="130" y="440" width="100" height="8" fill="#2a1d12"/>
    <rect x="137" y="448" width="5" height="70" fill="#2a1d12"/>
    <rect x="218" y="448" width="5" height="70" fill="#2a1d12"/>
    ${waves}
    <rect x="152" y="408" width="56" height="32" rx="4" fill="#4a3320"/>
    <circle cx="168" cy="424" r="7" fill="#2a1d12" stroke="${dark ? '#3a2a1c' : GLOW}"/>
    <rect x="184" y="416" width="18" height="3" fill="#1a120b"/>
    <rect x="184" y="425" width="18" height="3" fill="#1a120b"/>
    ${dark ? `<circle cx="200" cy="434" r="2.2" fill="#ff4a3a" class="blink"/>` : ""}
    ${shadow}
    <g class="${mode === 'enter' ? 'door-open' : 'door-static'}">
      <rect x="80" y="130" width="200" height="410" fill="#1c212d"/>
      <rect x="100" y="155" width="160" height="160" fill="none" stroke="#262c3a" stroke-width="3"/>
      <rect x="100" y="345" width="160" height="170" fill="none" stroke="#262c3a" stroke-width="3"/>
      <circle cx="262" cy="335" r="5" fill="#8a7a5a"/>
    </g>
    <rect x="80" y="130" width="200" height="410" fill="none" stroke="#2b3242" stroke-width="8"/>
    ${dark ? "" : `<polygon points="80,540 280,540 360,640 0,640" fill="${GLOW}" opacity=".2" class="beam"/>`}
  </g>
</svg>`;
}

const SVG_OPEN = `<svg viewBox="0 0 360 640" preserveAspectRatio="xMidYMid slice" aria-hidden="true">`;

/* Old woman's silhouette (headscarf), used for Sona xala's ghost */
const ghostShape = (dx = 0) => `<path transform="translate(${dx} 0)" d="M270 250 C252 250 248 272 252 290 L240 330 C232 400 236 470 230 540 L310 540 C304 470 308 400 300 330 L288 290 C292 272 288 250 270 250Z" fill="#040506" opacity=".92"/>`;

/* Sona xala's bedridden husband */
function sickroom() {
  return `${SVG_OPEN}
  <defs>
    <radialGradient id="lampw"><stop offset="0" stop-color="${GLOW}" stop-opacity=".45"/><stop offset="1" stop-color="${GLOW}" stop-opacity="0"/></radialGradient>
    <linearGradient id="moonl" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb3d9" stop-opacity=".22"/><stop offset="1" stop-color="#9fb3d9" stop-opacity="0"/></linearGradient>
  </defs>
  <rect width="360" height="640" fill="#0d0f15"/>
  <g class="push"><g transform="translate(0 -70)">
    <rect x="0" y="470" width="360" height="240" fill="#12151d"/>
    <rect x="215" y="130" width="100" height="140" fill="#16203a" stroke="#232a3a" stroke-width="6"/>
    <line x1="265" y1="130" x2="265" y2="270" stroke="#232a3a" stroke-width="4"/>
    <circle cx="290" cy="165" r="12" fill="#cfd8ea" opacity=".5"/>
    <polygon points="215,270 315,270 300,520 120,520" fill="url(#moonl)"/>
    <rect x="44" y="222" width="46" height="58" fill="#2a2016" stroke="#4a3a24" stroke-width="3"/>
    <ellipse cx="67" cy="246" rx="9" ry="11" fill="#1a130c"/>
    <path d="M52 278 C52 262 82 262 82 278Z" fill="#1a130c"/>
    <path d="M76 220 L92 220 L92 236Z" fill="#000"/>
    <circle cx="70" cy="380" r="90" fill="url(#lampw)" class="flicker-slow"/>
    <rect x="36" y="400" width="66" height="70" fill="#1a1510"/>
    <rect x="63" y="372" width="12" height="28" fill="#3a2a18"/>
    <polygon points="56,372 82,372 76,352 62,352" fill="${GLOW}" opacity=".85" class="flicker-slow"/>
    <rect x="42" y="386" width="8" height="14" rx="2" fill="#c9c2b0" opacity=".7"/>
    <rect x="86" y="382" width="9" height="18" rx="2" fill="#a14b3a" opacity=".8"/>
    <rect x="112" y="340" width="12" height="150" fill="#2a2016"/>
    <rect x="118" y="440" width="216" height="32" fill="#2b2620"/>
    <rect x="124" y="472" width="8" height="20" fill="#2a2016"/><rect x="322" y="472" width="8" height="20" fill="#2a2016"/>
    <ellipse cx="152" cy="432" rx="30" ry="12" fill="#cfc6b4" opacity=".55"/>
    <circle cx="160" cy="418" r="15" fill="#8d7f6c"/>
    <path d="M178 446 C190 412 300 414 334 440 L334 446Z" fill="#4a4436" class="breathe"/>
</g>
  </g>
</svg>`;
}

/* Looking out of the window: your own house across the street, someone in your window */
function windowView() {
  return `${SVG_OPEN}
  <defs>
    <linearGradient id="nsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#070a14"/><stop offset="1" stop-color="#1a2238"/></linearGradient>
    <radialGradient id="lamp2"><stop offset="0" stop-color="${GLOW}" stop-opacity=".5"/><stop offset="1" stop-color="${GLOW}" stop-opacity="0"/></radialGradient>
  </defs>
  <g class="push">
    <rect width="360" height="640" fill="url(#nsky)"/>
    <rect x="0" y="380" width="360" height="260" fill="#0c0e13"/>
    <rect x="0" y="372" width="360" height="10" fill="#161a24"/>
    <polygon points="100,230 180,180 260,230" fill="#121520"/>
    <rect x="100" y="230" width="160" height="150" fill="#141824"/>
    <rect x="128" y="260" width="40" height="50" fill="#0a0c11"/>
    <rect x="192" y="260" width="40" height="50" fill="${GLOW}" opacity=".85"/>
    <g class="late"><ellipse cx="212" cy="280" rx="7" ry="8" fill="#1a1208"/><path d="M200 310 C200 292 224 292 224 310Z" fill="#1a1208"/></g>
    <rect x="166" y="330" width="28" height="50" fill="#0a0c11"/>
    <line x1="40" y1="380" x2="40" y2="250" stroke="#1d2230" stroke-width="3"/>
    <circle cx="40" cy="250" r="40" fill="url(#lamp2)" class="flicker-slow"/>
    <circle cx="40" cy="250" r="3" fill="${GLOW}"/>
    <path fill-rule="evenodd" d="M0 0H360V640H0Z M70 130H290V470H70Z" fill="#0f1219"/>
    <rect x="70" y="130" width="220" height="340" fill="none" stroke="#252b3a" stroke-width="10"/>
    <line x1="180" y1="130" x2="180" y2="470" stroke="#252b3a" stroke-width="6"/>
    <line x1="70" y1="300" x2="290" y2="300" stroke="#252b3a" stroke-width="6"/>
    <rect x="50" y="470" width="260" height="14" fill="#1a1f2b"/>
    <g opacity=".14" class="flicker-slow"><ellipse cx="180" cy="370" rx="22" ry="26" fill="#cfd8ea"/><path d="M140 470 C140 410 220 410 220 470Z" fill="#cfd8ea"/></g>
  </g>
</svg>`;
}

/* Your own living room: parents watching TV at 03:17; you stand there, translucent */
function homeView() {
  return `${SVG_OPEN}
  <defs><radialGradient id="tvg" cx="85%" cy="55%" r="70%"><stop offset="0" stop-color="#6f9bff" stop-opacity=".45"/><stop offset="1" stop-color="#6f9bff" stop-opacity="0"/></radialGradient></defs>
  <rect width="360" height="640" fill="#0b0e15"/>
  <g class="push"><g transform="translate(0 -70)">
    <rect x="0" y="470" width="360" height="240" fill="#10131b"/>
    <circle cx="147" cy="167" r="17" fill="#141824" stroke="#262c3a" stroke-width="3"/>
    <line x1="147" y1="167" x2="156" y2="169" stroke="#8b90a0" stroke-width="2.5"/>
    <line x1="147" y1="167" x2="159" y2="170" stroke="#8b90a0" stroke-width="1.5"/>
    <rect width="360" height="640" fill="url(#tvg)" class="tv"/>
    <rect x="290" y="330" width="80" height="56" fill="#9fc0ff" opacity=".85" class="tv"/>
    <rect x="300" y="386" width="60" height="84" fill="#141824"/>
    <rect x="30" y="390" width="230" height="64" rx="14" fill="#161b28"/>
    <circle cx="110" cy="372" r="17" fill="#07090d"/><path d="M84 420 C84 392 136 392 136 420Z" fill="#07090d"/>
    <circle cx="190" cy="368" r="19" fill="#07090d"/><path d="M162 420 C162 390 218 390 218 420Z" fill="#07090d"/>
    <path d="M110 355 a17 17 0 0 1 17 17" fill="none" stroke="#6f9bff" stroke-opacity=".6" stroke-width="2"/>
    <path d="M190 349 a19 19 0 0 1 19 19" fill="none" stroke="#6f9bff" stroke-opacity=".6" stroke-width="2"/>
    <rect x="22" y="440" width="246" height="40" rx="10" fill="#1b2130"/>
    <rect x="30" y="480" width="10" height="16" fill="#0d1017"/><rect x="250" y="480" width="10" height="16" fill="#0d1017"/>
</g>
  </g>
  <g opacity=".18" class="flicker-slow"><ellipse cx="60" cy="230" rx="22" ry="26" fill="#cfd8ea"/><path d="M20 400 C20 280 100 280 100 400Z" fill="#cfd8ea"/></g>
</svg>`;
}

/* Your bedroom: "self" = you asleep, "ghost" = Sona xala in the corner, "end" = she leans over you */
function bedroom(mode) {
  const end = mode === "end";
  const ghost = mode === "ghost" ? `<g class="late">${ghostShape()}</g>` : end ? `<g class="beam">${ghostShape(-150)}</g>` : "";
  return `${SVG_OPEN}
  <defs><linearGradient id="moonb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9fb3d9" stop-opacity=".25"/><stop offset="1" stop-color="#9fb3d9" stop-opacity="0"/></linearGradient></defs>
  <rect width="360" height="640" fill="#0b0d13"/>
  <g class="${mode === 'self' ? 'push' : ''}"><g transform="translate(0 -70)">
    <rect x="0" y="470" width="360" height="240" fill="#11141c"/>
    <rect x="40" y="130" width="100" height="140" fill="#16203a" stroke="#232a3a" stroke-width="6"/>
    <line x1="90" y1="130" x2="90" y2="270" stroke="#232a3a" stroke-width="4"/>
    <circle cx="66" cy="160" r="11" fill="#cfd8ea" opacity=".55"/>
    <polygon points="40,270 140,270 300,470 80,470" fill="url(#moonb)"/>
    <rect x="40" y="350" width="12" height="140" fill="#1c2232"/>
    <rect x="46" y="440" width="270" height="32" fill="#1f2738"/>
    <rect x="52" y="472" width="8" height="18" fill="#1c2232"/><rect x="304" y="472" width="8" height="18" fill="#1c2232"/>
    <ellipse cx="88" cy="432" rx="30" ry="12" fill="#cdd5e4" opacity=".5"/>
    <circle cx="96" cy="418" r="15" fill="#9a8f80"/>

/* ---------- Audio: generated with Web Audio, no files ---------- */
const A = {ctx: null, master: null, noise: null, amb: null, on: true};

function audioInit() {
  if (A.ctx) return;
  try {
    const C = window.AudioContext || window.webkitAudioContext;
    A.ctx = new C();
    A.master = A.ctx.createGain();
    A.master.gain.value = A.on ? 0.9 : 0;
    A.master.connect(A.ctx.destination);
    const b = A.ctx.createBuffer(1, A.ctx.sampleRate * 2, A.ctx.sampleRate), d = b.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    A.noise = b;
  } catch (e) { A.ctx = null; }
}
const now = () => A.ctx.currentTime;
function noiseSrc() { const s = A.ctx.createBufferSource(); s.buffer = A.noise; s.loop = true; return s; }
function filt(type, f, q = 1) { const x = A.ctx.createBiquadFilter(); x.type = type; x.frequency.value = f; x.Q.value = q; return x; }
function envGain(t, peak, att, dec) {
  const g = A.ctx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.linearRampToValueAtTime(peak, t + att);
  g.gain.exponentialRampToValueAtTime(0.0001, t + att + dec);
  return g;
}

const sfx = {
  thump(delay = 0, vol = .5) {
    if (!A.ctx) return; const t = now() + delay;
    const o = A.ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(80, t); o.frequency.exponentialRampToValueAtTime(38, t + .25);
    const g = envGain(t, vol, .01, .3); o.connect(g).connect(A.master); o.start(t); o.stop(t + .4);
  },
  creak(delay = 0) {
    if (!A.ctx) return; const t = now() + delay;
    const o = A.ctx.createOscillator(); o.type = "sawtooth";
    o.frequency.setValueAtTime(150, t); o.frequency.linearRampToValueAtTime(95, t + 1.4); o.frequency.linearRampToValueAtTime(120, t + 2.4);
    const am = A.ctx.createOscillator(); am.frequency.value = 22;
    const amG = A.ctx.createGain(); am.connect(amG);
    const g = envGain(t, .16, .25, 2.3); amG.gain.value = .12; amG.connect(g.gain);
    o.connect(filt("bandpass", 950, 5)).connect(g).connect(A.master);
    o.start(t); am.start(t); o.stop(t + 2.7); am.stop(t + 2.7);
  },
  whisper(delay = 0) {
    if (!A.ctx) return;
    [0, .45, .8].forEach((d, i) => {
      const t = now() + delay + d, n = noiseSrc();
      const g = envGain(t, .09 - i * .02, .08, .35);
      n.connect(filt("bandpass", 2600 + i * 400, 1.2)).connect(g).connect(A.master);
      n.start(t); n.stop(t + .5);
    });
  },
  click() {
    if (!A.ctx) return; const t = now();
    const o = A.ctx.createOscillator(); o.type = "square"; o.frequency.value = 1100;
    const g = envGain(t, .12, .003, .05); o.connect(g).connect(A.master); o.start(t); o.stop(t + .08);
  },
  tick() {
    if (!A.ctx) return; const t = now();
    const o = A.ctx.createOscillator(); o.type = "triangle"; o.frequency.value = 1700 + Math.random() * 300;
    const g = envGain(t, .018, .002, .03); o.connect(g).connect(A.master); o.start(t); o.stop(t + .05);
  },
  select() {
    if (!A.ctx) return; const t = now();
    const o = A.ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(660, t); o.frequency.exponentialRampToValueAtTime(330, t + .25);
    const g = envGain(t, .1, .01, .3); o.connect(g).connect(A.master); o.start(t); o.stop(t + .35);
  },
  boom() {
    if (!A.ctx) return; const t = now();
    const o = A.ctx.createOscillator(); o.type = "sine";
    o.frequency.setValueAtTime(55, t); o.frequency.exponentialRampToValueAtTime(28, t + 2.5);
    const g = envGain(t, .5, .03, 2.8); o.connect(g).connect(A.master); o.start(t); o.stop(t + 3);
    const n = noiseSrc(), ng = envGain(t, .12, .02, 1.5);
    n.connect(filt("lowpass", 300)).connect(ng).connect(A.master); n.start(t); n.stop(t + 1.6);
  },
  steps(count = 6, gap = .55) { for (let i = 0; i < count; i++) sfx.thump(i * gap, .18); },
  shots(delay = 0) {
    if (!A.ctx) return;
    [0, .16, .3, .85, 1, 1.5].forEach(d => {
      const t = now() + delay + d, n = noiseSrc(), g = envGain(t, .28, .002, .16);
      n.connect(filt("bandpass", 1400, .8)).connect(g).connect(A.master); n.start(t); n.stop(t + .22);
      sfx.thump(delay + d, .3);
    });
  },
  breath(delay = 0) {
    if (!A.ctx) return;
    [0, 2.2, 4.4].forEach(d => {
      const t = now() + delay + d, n = noiseSrc(), g = A.ctx.createGain();
      g.gain.setValueAtTime(.0001, t); g.gain.linearRampToValueAtTime(.06, t + .8); g.gain.linearRampToValueAtTime(.0001, t + 1.8);
      n.connect(filt("bandpass", 700, 1.5)).connect(g).connect(A.master); n.start(t); n.stop(t + 1.9);
    });
  }
};

function ambient(kind) {
  stopAmbient();
  if (!A.ctx) return;
  const t = now(), out = A.ctx.createGain();
  out.gain.setValueAtTime(0, t); out.gain.linearRampToValueAtTime(1, t + 2); out.connect(A.master);
  const nodes = [], radio = kind === "radio" || kind === "listen" || kind === "tv";
  const base = kind === "run" ? 41 : kind === "off" ? 46 : kind === "day" ? 65 : 55;
  const lp = filt("lowpass", kind === "run" ? 420 : 230); lp.connect(out);
  const dg = A.ctx.createGain(); dg.gain.value = kind === "off" || kind === "day" ? .03 : .05; dg.connect(lp);
  [base, base * 1.012, base * 1.5].forEach(f => {
    const o = A.ctx.createOscillator(); o.type = "sawtooth"; o.frequency.value = f; o.connect(dg); o.start(); nodes.push(o);
  });
  const n = noiseSrc(), ng = A.ctx.createGain();
  ng.gain.value = kind === "tv" ? .025 : radio ? .05 : kind === "day" ? .03 : .015;
  n.connect(filt("bandpass", radio ? 1600 : 500, radio ? 3 : .7)).connect(ng).connect(out); n.start(); nodes.push(n);
  if (radio) {
    const lfo = A.ctx.createOscillator(), lg = A.ctx.createGain();
    lfo.frequency.value = kind === "listen" ? 3 : kind === "tv" ? 11 : 7; lg.gain.value = .035; lfo.connect(lg).connect(ng.gain); lfo.start(); nodes.push(lfo);
  }
  let timer = null;
  if (kind === "run") timer = setInterval(() => { sfx.thump(0, .45); sfx.thump(.18, .3); }, 620);
  A.amb = {out, nodes, timer};
}
function stopAmbient() {
  const a = A.amb; if (!a) return; A.amb = null;
  clearInterval(a.timer);
  const t = now();
  a.out.gain.cancelScheduledValues(t); a.out.gain.setValueAtTime(a.out.gain.value, t); a.out.gain.linearRampToValueAtTime(0, t + .8);
  setTimeout(() => { a.nodes.forEach(x => { try { x.stop(); } catch (e) {} }); a.out.disconnect(); }, 1000);
}

const $ = id => document.getElementById(id);
const stage = $("stage"), sceneEl = $("scene"), cap = $("cap"), choicesEl = $("choices"),
      endEl = $("end"), startEl = $("start"), bars = $("bars"), hint = $("hint");
const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
let path = [], picks = [], runId = 0, skip = false, started = false;

const wait = ms => new Promise(r => setTimeout(r, skip ? 0 : ms));

function renderBars(fill) {
  const total = Math.max(3, path.length + (S[path.at(-1)].end ? 0 : 1));
  bars.innerHTML = Array.from({length: total}, (_, i) =>
    `<div class="bar"><i style="width:${i < path.length - 1 ? 100 : i === path.length - 1 ? fill * 100 : 0}%"></i></div>`).join("");
}
function setFill(f) { const b = bars.children[path.length - 1]; if (b) b.firstChild.style.width = f * 100 + "%"; }

async function play(id) {
  const sc = S[id], my = ++runId;
  path.push(id); skip = reduced;
  sceneEl.innerHTML = sc.svg();
  cap.innerHTML = ""; choicesEl.hidden = true; endEl.hidden = true;
  renderBars(0);
  ambient(sc.amb);
  sc.fx?.();
  await wait(900);
  for (let i = 0; i < sc.lines.length; i++) {
    if (my !== runId) return;
    cap.querySelectorAll("p").forEach(p => { p.className = "old"; });
    const p = document.createElement("p"); p.className = "cur"; cap.append(p);
    const text = sc.lines[i];
    for (let c = 1; c <= text.length; c++) {
      if (my !== runId) return;
      if (skip) { p.textContent = text; break; }
      p.textContent = text.slice(0, c);
      if (text[c - 1] !== " ") sfx.tick();
      setFill((i + c / text.length) / sc.lines.length);
      await wait(38);
    }
    setFill((i + 1) / sc.lines.length);
    if (my !== runId) return;
    // Reading pause: longer lines stay on screen longer before the next one types out
    await wait(i < sc.lines.length - 1 ? 900 + text.length * 22 : 600);
  }
  if (my !== runId) return;
  sc.end ? showEnd(sc) : showChoices(sc);
}

function showChoices(sc) {
  choicesEl.innerHTML = `<p class="ask">Qərar səninlə</p>`;
  sc.choices.forEach(([label, next], i) => {
    const b = document.createElement("button");
    b.className = "choice"; b.type = "button"; b.id = "choice-" + next;
    b.innerHTML = `${label}<span>${i ? "B" : "A"}</span>`;
    b.addEventListener("click", e => { e.stopPropagation(); sfx.select(); picks.push(label); play(next); });
    choicesEl.append(b);
  });
  choicesEl.hidden = false;
  choicesEl.querySelector(".choice").focus({preventScroll: true});
}

function showEnd(sc) {
  sfx.boom();
  endEl.innerHTML = `<p class="ask">Bölüm 1 bitdi · Son: ${sc.end}</p>
    <h2>Növbəti bölüm bu seçimdən başlayır.</h2>
    <p class="path">Seçimlərin: ${picks.join(" → ")}</p>
    <button class="choice" type="button" id="restart">Yenidən başla<span>↺</span></button>`;
  endEl.hidden = false;
  $("restart").addEventListener("click", e => { e.stopPropagation(); sfx.select(); path = []; picks = []; play("start"); });
}

/* ---------- Controls ---------- */
function setSound(on) {
  A.on = on; $("tog-sound").setAttribute("aria-pressed", on);
  if (A.master) A.master.gain.setTargetAtTime(on ? .9 : 0, now(), .1);
}
function begin(e) {
  e.stopPropagation();
  audioInit(); A.ctx?.resume?.();
  setSound(A.on);
  startEl.hidden = true; started = true;
  play("start");
}
$("go").addEventListener("click", begin);
$("tog-sound").addEventListener("click", () => { audioInit(); A.ctx?.resume?.(); setSound(!A.on); });

function skipNow() { if (!started) return; skip = true; }
stage.addEventListener("click", skipNow);
stage.addEventListener("keydown", e => { if (e.key === " " && e.target === stage) { e.preventDefault(); skipNow(); } });

sceneEl.innerHTML = corridor();
</script>
